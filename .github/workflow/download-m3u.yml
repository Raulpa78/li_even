name: Download M3U

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Run hourly (adjust as needed)
  push:
    branches:
      - main

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run download_m3u.py script
        env:
          EVENTOS_VIV_URL: ${{ secrets.EVENTOS_VIV_URL }}
        run: python download_m3u.py

      - name: Upload eventos.m3u as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eventos
          path: eventos.m3u
          retention-days: 30

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add eventos.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update eventos.m3u" && git push)